# Which language the unqualified res/values/ folder is written in.
#
# AGP cannot infer it: res/values/ is the fallback for every locale, not a declaration of one. With
# generateLocaleConfig on, this is what lets the generated config say "en" rather than leaving the
# default nameless — and without the file the build refuses outright rather than guessing.
unqualifiedResLocale=en
